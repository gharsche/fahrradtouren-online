name: Refresh Strava activities

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: strava-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned encryption dependency
        run: python -m pip install --disable-pip-version-check PyNaCl==1.5.0

      - name: Test Strava transformation and safety
        run: python tools/test_strava_refresh.py

      - name: Refresh Strava snapshot
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_TOKEN_ENCRYPTION_KEY: ${{ secrets.STRAVA_TOKEN_ENCRYPTION_KEY }}
          GITHUB_ACTIONS: "true"
        run: python tools/refresh_strava.py

      - name: Verify refreshed data is wired to the site builder
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('content/strava-latest-activities.json').read_text())
          assert data['activities'] and data.get('map_url', '').startswith('https://maps.googleapis.com/maps/api/staticmap?')
          builder = Path('tools/build_site.py').read_text()
          assert 'STRAVA_ACTIVITY_PATH' in builder and '_site_activities()' in builder
          print(f"Validated snapshot: {len(data['activities'])} activities")
          PY

      - name: Build static website
        run: python tools/build_site.py

      - name: Verify generated site
        run: python tools/test_site.py

      - name: Commit refreshed public data and site
        run: |
          git add content/strava-latest-activities.json content/strava-latest-map-url.txt docs/
          if git diff --cached --quiet; then
            echo "No public Strava or site changes to publish."
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh Strava activities and site'
            git push origin HEAD:main
          fi
